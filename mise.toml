# The workspace toolchain, declared rather than accumulated.
#
# The container's disk is ephemeral, so a tool installed by hand is gone at the next sleep. Rather
# than syncing a mutable home directory, the toolchain is declared here and baked into the image by
# CI: adding a tool is a commit, which is reproducible, reviewable and identical for every session.
#
# [tools]
# ripgrep = "latest"
# ast-grep = "latest"
# uv = "latest"

[tasks.install]
description = "Install the declared toolchain"
run = "mise install"

[tasks.check]
description = "Show what is installed and what is missing"
run = "mise ls"

# Node's own test runner, so the suite adds no dependency. It covers the two leases, which are pure
# state machines in src/leases.ts; the sockets and the container are not reachable from here.
[tasks.test]
description = "Run the lease tests (Node's built-in test runner)"
run = "node --test 'tests/**/*.test.mjs'"
