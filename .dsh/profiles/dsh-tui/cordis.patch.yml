# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# Subagent child defaults — spawned/forked workers route to gpt-5.6-luna on
# cheapinference-com instead of inheriting the parent (agent-default-model)
# route. dsh-tool-subagent's `agentOptions` config is the child provider/model
# default (plus the schema-required reasoningEffort and maxTokens); the active
# tool-subagent rows live in the standard agent preset, so these entries restate
# each preset row's config and merge in agentOptions. The spawn/fork providers
# advertise the agentOptions capability, so no route-preflight block.
- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    modelSelectionSettings: true
    backgroundMode: continuable
    agentOptions:
      provider: cheapinference-com
      model: gpt-5.6-luna
      reasoningEffort: high
      maxTokens: 128000

- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: continuable
    agentOptions:
      provider: cheapinference-com
      model: gpt-5.6-luna
      reasoningEffort: high
      maxTokens: 128000
