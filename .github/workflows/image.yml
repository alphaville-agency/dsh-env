# Builds the workspace image on GitHub's runners and pushes it to GHCR.
#
# This is deliberate: `wrangler deploy` with a Dockerfile path needs Docker locally, and the whole
# point of this repository is not depending on one particular laptop. With a registry reference the
# deploy needs no local Docker at all.
name: image

on:
  push:
    branches: [main]
    paths: ["container.Dockerfile", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Containers require linux/amd64.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./container.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/alphaville-agency/dsh-workspace:latest
