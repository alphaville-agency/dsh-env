# Deploys the Worker and builds the container image on GitHub's runners.
#
# GitHub's ubuntu runners already have Docker, which `wrangler deploy` needs to build the image, so
# the build happens here rather than on anyone's laptop. `@cloudflare/sandbox` comes from the
# committed lockfile, so nothing about this repository needs anything installed locally first.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # THE MODEL CREDENTIAL, SET BEFORE THE DEPLOY THAT NEEDS IT.
      #
      # The profile names `apiKeyEnv: CF_AI_GATEWAY_TOKEN`, so the container is useless without that
      # variable and the failure is silent until a session tries to reach a model. Setting it here
      # rather than by hand is what makes the config and the credential land in the same deploy: the
      # previous key was a Worker secret someone had put there manually, which is a step that exists
      # only in someone's memory and cannot be reviewed.
      #
      # `wrangler secret put` reads the value from stdin, so the value is never an argument and never
      # appears in the run log.
      - name: model credential
        run: echo "${{ secrets.CF_AI_GATEWAY_TOKEN }}" | npx wrangler secret put CF_AI_GATEWAY_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy