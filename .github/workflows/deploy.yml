# Deploys the Worker and builds the container image on GitHub's runners.
#
# GitHub's ubuntu runners already have Docker, which `wrangler deploy` needs to build the image, so
# the build happens here rather than on anyone's laptop. `@cloudflare/sandbox` comes from the
# committed lockfile, so nothing about this repository needs anything installed locally first.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy