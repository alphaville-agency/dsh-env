ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-default-model:
  provider: cf-ai-gateway
  model: deepseek-v4.1-flash
subagent-model-selection:
  enabled: true
  allowedModels:
    - provider: cf-ai-gateway
      model: gpt-5.6-luna
    - provider: cf-ai-gateway
      model: deepseek-v4.1-flash
    - provider: cf-ai-gateway
      model: mimo-v2.6-flash
    - provider: cf-ai-gateway
      model: gpt-5.6-sol
# ONE PROVIDER, AND THE SAME ONE AS THE LAPTOP. The only difference between this environment and the
# operator's machine is the path segment: /dsh here, /operator there, /alphaville for the agency.
# Everything else — which account is already paid for at this instant, and which model is the closest
# match in it — is decided behind that URL by the inference-router Worker, so this file carries no
# provider key and no time logic.
llm-pi-ai:
  providers:
    cf-ai-gateway:
      displayName: aig.drksci.com (dsh)
      apiKeyEnv: CF_AI_GATEWAY_TOKEN
      api: openai-completions
      baseURL: https://aig.drksci.com/dsh/v1
      models:
        - id: deepseek-v4.1-flash
          name: deepseek-v4.1-flash
          contextWindow: 1048576
          maxTokens: 384000
        - id: gpt-5.6-luna
          name: gpt-5.6-luna
          contextWindow: 1050000
          maxTokens: 128000
        - id: mimo-v2.6-flash
          name: mimo-v2.6-flash
          contextWindow: 1048576
          maxTokens: 128000
        - id: gpt-5.6-sol
          name: gpt-5.6-sol
          contextWindow: 1050000
          maxTokens: 128000
# Left empty on purpose: one route, because a second configured provider is a second place a session
# can spend money and a second credential to keep.
llm-deepseek:
  models: []
