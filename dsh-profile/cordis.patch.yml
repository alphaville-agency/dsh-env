# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# Subagent child defaults — spawned/forked workers route to gpt-5.6-luna on
# cf-ai-gateway instead of inheriting the parent (agent-default-model)
# route. dsh-tool-subagent's `agentOptions` config is the child provider/model
# default (plus the schema-required reasoningEffort and maxTokens); the active
# tool-subagent rows live in the standard agent preset, so these entries restate
# each preset row's config and merge in agentOptions. The spawn/fork providers
# advertise the agentOptions capability, so no route-preflight block.
- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    modelSelectionSettings: true
    backgroundMode: continuable
    agentOptions:
      provider: cf-ai-gateway
      model: gpt-5.6-luna
      reasoningEffort: high
      maxTokens: 128000

- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: continuable
    agentOptions:
      provider: cf-ai-gateway
      model: gpt-5.6-luna
      reasoningEffort: high
      maxTokens: 128000

# THE SESSION RUNS WITH FULL ACCESS, WITHOUT PROMPTS.
#
# The agency is autonomous: it decides, acts and reports rather than asking to act. A preset of
# `workspace-write` plus `approval: ask` would put the operator back in the loop as a human
# speed bump - the exact dependency `GOALS.md` asks to remove ("does this make the agency more or
# less able to operate without us?"). `danger-full-access` is the harness's own preset for this:
# `sandbox: danger-full-access, approval: never` - full file access, no approval prompts.
#
# This is a permission for the WORK, not for money: it does not fund a wallet or mint a shared
# account. Those bounds live in AGENTS.md and in the gateway's rate limit.
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    defaultPreset: danger-full-access
